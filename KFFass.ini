
// Targeting reticle weapons can disable their HUD with console command
// ToggleWeaponHUD or Setbind H ToggleWeaponHUD
// If you disable weapon HUD and then drop weapon and equiped again, it will display HUD again (since all the code is in weapon itself, so it retriggers everything from there)
// you can also change some color attributes of these crosshairs because why not, i mean you already can change other settings so...
// note, if you change colors in-game, it will ConfigSave them and thus will remove every piece of comment you are reading right now, so idk, save this copy if you wanna lol

// ****************************************** Aureolin ******************************************
[Fass.KFWeap_Aureolin]
// Return Chamber
AmmoChance=0.12f
// Combustion Rounds passive
PassiveAddArmor=2
PassiveHealUser=false // added healing cuz why not lmao
PassiveHealAmount=2
// Scope
UnscopeOnDamaged=true
CrosshairColorNeutral=(R=0,G=168,B=255,A=255)
CrosshairColorEmpty=(R=255,G=0,B=0,A=255)
CrosshairColorTargetingZED=(R=255,G=0,B=0,A=255)
CrosshairColorTargetingFriendly=(R=0,G=255,B=0,A=255)
ScopeOutlineColor=(R=0,G=168,B=255,A=255)
SeeThroughFloat=190 // from 0 to 255 (0 is basically disabled)
SeeThroughRingFloat=255 // ring around the edge of parascope (it's controled separately from main parascope)
// When Combustion Rounds is active
PerkCrosshairColorNeutral=(R=255,G=168,B=0,A=255)
PerkCrosshairColorTargetingZED=(R=255,G=0,B=0,A=255)
PerkCrosshairColorTargetingFriendly=(R=0,G=255,B=0,A=255)
// Inner ring
ScopeRingInnerColorNeutral=(R=0,G=168,B=255,A=255)
ScopeRingInnerColorEmpty=(R=255,G=0,B=0,A=255)
ScopeRingInnerColorTargetingZED=(R=255,G=0,B=0,A=255)
ScopeRingInnerColorTargetingFriendly=(R=0,G=255,B=0,A=255)
// Zoom display
EnableZoomLevelDisplay=true
ZoomLevelDisplayColor=(R=255,G=255,B=255,A=255)

// ****************************************** Calderon ******************************************
[Fass.KFWeap_Calderon]
// EnableProjectileRandomizer=true // Weather weapon should randomize the projectile (you can toggle this live in game with ToggleProjectileRandomizer console command) (so don't touch this)
// this weapon can change colors here in config or with console commands bellow
// ChangeDefaultGlowColor, ChangeHeatGlowColor, ChangeFreezeGlowColor, ChangeToxinGlowColor and ChangeElectricGlowColor (values can be from 0 to 255)
GlowColorDefault=(R=0.18,G=0.93,B=1)
GlowColorHeat=(R=5,G=0.2,B=0)
GlowColorFreeze=(R=1,G=2,B=50)
GlowColorToxin=(R=1,G=10,B=1)
GlowColorElectric=(R=0,G=0.5,B=1)
// this particular weapon allows you to switch elemental projectiles when randomizer is OFF
// type in console ToggleProjectileRandomizer to either Enable (it's Enabled on weapon equip by default) or Disable it and bellow to select specific projectile
// SelectProjectileExplosive, SelectProjectileHeat, SelectProjectileFreezing, SelectProjectileToxin or SelectProjectileElectric
// ToggleWeaponHUD will disable reticle and instead enable compact version near main perk icon
// you can also disable compact version with ToggleCompactWeaponHUD, note that compact version will be only visible if ToggleWeaponHUD is OFF (if that makes sense anymore, kill me)
// Projectile Array
ProjectileArrayCount=2
// Elemental Orb
ElementalPickupChance=0.25 //0.3
ElementSpawnOffsetZ=65
ElementHalfConeAngle=30
ElementSpawnSpeed=900
// Misc settings
SelfDamageReductionValue=0.1f
// Message that gets displayed when user tries to switch to SelectProjectile but EnableProjectileRandomizer is ON (you can type anything in here lmao)
CanOnlyText="Can only toggle this if EnableProjectileRandomizer is OFF"

[Fass.KFProj_HighExplosive_Calderon]
ExplosionDamage=215 //225
ExplosionRadius=800 //850
// Perk Passive
NukeExplosionChance=0.12

[Fass.KFProj_HighExplosive_Calderon_Heat]
NapalmExplosionDamage=100
NapalmExplosionRadius=500
// DoT (commented)
// HeatDamage=15
// HeatDamageRadius=600
// HeatEffectDuration=10
// HeatDamageInterval=0.5
// HeatExplosionOffsetZ=35

[Fass.KFProj_HighExplosive_Calderon_Freezing]
FreezeExplosionDamage=25
FreezeExplosionRadius=650

[Fass.KFProj_HighExplosive_Calderon_Toxin]
ExplosionDamage=30
ExplosionRadius=350
// DoT
GasDamage=17
GasDamageRadius=550
GasExplosionOffsetZ=35
GasCloudEffectDuration=10.0f
GasCloudDamageInterval=0.5f

[Fass.KFProj_HighExplosive_Calderon_Electric]
EMPExplosionDamage=20
EMPExplosionRadius=700
MaxNumberOfZedsZapped=2
MaxDistanceToBeZapped=600 //800
ZapInterval=0.2 // how often to zap, larger values up to 1 are less zaps
ZapDamage=12

// ****************************************** Divine Punishment ******************************************
[Fass.KFWeap_DivinePunishment]
// Divine Favor
HealingRingSpawnOffsetZ=-5
MinClock=0 // generally speaking, keep this at 0 but you can adjust this as you wish
MinClockH=0 // in code, starting clock value after MinClock (set both to same value or just this so that on second explosion we start at this timer instead)
MaxClock=12 // this value can be any number so hopefully UI shouldn't be going off centered
ExplosionDamage=145 // 225
ExplosionRadius=1000 // 10 meters
HealingAmount=25
ArmorRepairAmount=0 // 0 means disabled :D
// Swiftess Speed
SwiftessSpeedRange=1000 // 10 meters
SwiftessSpeedChance=0.26f
SwiftessSpeedAmount=3 // 3 as in amount of buffs it gives, if it was one, it would give only 1x buff (3 is max btw)
// Misc settings
SelfDamageReductionValue=0.14f

// ****************************************** Earth Splitter ******************************************
[Fass.KFWeap_EarthSplitter]
// Needle Rounds
